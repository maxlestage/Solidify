[package]
name = "solidify-site-worker"
version = "0.1.0"
edition = "2024"
publish = false
description = "The service worker of the Solidify website, in Rust: keeps the site for offline use."

# Built for the browser with `wasm-bindgen --target no-modules` (service workers run
# classic scripts); the site's server inlines the binary into `sw.js` (see site/src/pwa.rs).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Cache",
  "CacheStorage",
  "Clients",
  "ExtendableEvent",
  "FetchEvent",
  "Request",
  "RequestMode",
  "Response",
  "ResponseType",
  "ServiceWorkerGlobalScope",
  "Url",
  "WorkerGlobalScope",
  "WorkerLocation",
] }
