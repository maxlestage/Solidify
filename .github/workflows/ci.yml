name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Lint (native)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint (browser)
        run: cargo clippy -p solidify-site --lib --target wasm32-unknown-unknown -- -D warnings
      # Translates every test program, compiles it with rustc and compares its output
      # with what Node.js printed (the .out files).
      - name: Test
        run: cargo test --workspace
      # Same commands as the Dockerfile.
      - name: Build the site
        run: |
          cargo build -p solidify-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/solidify_site.wasm
          cargo build -p solidify-site --bin solidify-site --release
      # Same command as pages.yml: the static version of the site for GitHub Pages.
      - name: Export the site as static files
        run: BASE_PATH=/Solidify cargo run --release -p solidify-site -- export dist
      - name: Package the crate
        run: cargo package -p solidify --allow-dirty

  # Every branch is merged into master as soon as everything above is green (master is then
  # published on GitHub Pages by pages.yml). Branches named wip/... are never merged.
  merge:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') &&
      github.ref_name != 'master' && !startsWith(github.ref_name, 'wip/')
    needs: [rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge into master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin master
      # A push made with the workflow's token starts no workflow: publish the site by hand.
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
