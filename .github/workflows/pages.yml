name: Pages

# Publishes the website on GitHub Pages (https://<owner>.github.io/<repository>/) as static
# files: `solidify-site export` renders every page with the server's own code, links behind
# the repository's path, and the playground runs Solidify as WebAssembly.
#
# Runs after every successful CI run of a push on master, and by hand from the Actions tab.
# A red CI publishes nothing.
#
# The first run switches GitHub Pages on for the repository (Settings → Pages → Source:
# GitHub Actions) with the workflow's own token; nothing to click.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Switches Pages on when it is not yet (build type "workflow"); when the token is not
  # allowed to, skips with a warning instead of failing.
  check:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: enable
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$source" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages could not be switched on from here: Settings → Pages → Build and deployment → Source: GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the browser bundle
        run: |
          cargo build -p solidify-site --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --out-dir site/pkg target/wasm32-unknown-unknown/wasm-release/solidify_site.wasm
          cargo build -p solidify-site-worker --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target no-modules --no-typescript --out-dir site/pkg/worker target/wasm32-unknown-unknown/wasm-release/solidify_site_worker.wasm
      - name: Export the site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: cargo run --release -p solidify-site -- export dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
